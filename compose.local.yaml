# 仅供 deploy.sh 使用。文件名不是 compose.override.yaml，因此普通 docker compose 不会自动加载它。
# 覆盖 compose.yaml 中的远程镜像：用当前仓库的 Dockerfile 构建 opencode2api:local，并且不再拉取远程标签。
services:
  opencode2api:
    image: opencode2api:local
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 写入二进制版本号，便于日志里区分本地构建。
        VERSION: local
